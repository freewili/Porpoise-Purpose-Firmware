name: Validate firmware packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate every release
        shell: python
        run: |
          import pathlib, subprocess, sys
          for manifest in pathlib.Path('releases').glob('*/manifest.json'):
              subprocess.run([sys.executable,'scripts/package_release.py',str(manifest.parent)],check=True)
